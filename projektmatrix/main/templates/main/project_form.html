{% extends "main/base.html" %}

{% block title %}
    Update Project
{% endblock %}

{% block content %}
<div class="page-card">
    <h1 class="h3 mb-4">
        {% if object %}
            Update Project
        {% else %}
            Create Project
        {% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save
        </button>

        <a
            href="{% url 'project-list' %}"
            class="btn btn-outline-secondary"
        >
            Cancel
        </a>
    </form>
</div>
{% endblock %}
